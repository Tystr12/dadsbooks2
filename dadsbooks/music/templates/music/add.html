{% extends "music/base.html" %}

{% block content %}

<style>
    h1 {
        margin-top: 0;
        margin-bottom: 24px;
    }

    form p {
        margin-bottom: 18px;
    }

    label {
        display: block;
        font-weight: bold;
        margin-bottom: 6px;
    }

    input[type="text"],
    input[type="number"],
    input[type="url"],
    textarea,
    select {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border: 1px solid #ccd1d5;
        border-radius: 6px;
        font-size: 15px;
    }

    textarea {
        min-height: 160px;
        resize: vertical;
    }

    .buttons {
        margin-top: 24px;
        display: flex;
        gap: 12px;
        align-items: center;
    }

    button {
        background: #2563eb;
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #1d4ed8;
    }

    .cancel {
        color: #555;
        text-decoration: none;
    }

    .cancel:hover {
        text-decoration: underline;
    }
</style>

<h1>Add record manually</h1>

{% if user.is_superuser %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="buttons">
            <button type="submit">Save record</button>
            <a class="cancel" href="{% url 'music_search' %}">Cancel</a>
        </div>
    </form>
{% else %}
    <p>You are not logged in as admin.</p>
{% endif %}

{% endblock %}
