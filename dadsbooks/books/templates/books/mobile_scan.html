{% extends "books/base.html" %}

{% block content %}

<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>

<div id="scanner" style="width:100%; max-width:400px;"></div>

<form method="post" id="isbnForm">
    {% csrf_token %}
    <input type="text" name="barcode" id="barcodeInput">
</form>

<style>
    #scanner {
    width: 100%;
    max-width: 350px;
    margin: 0 auto;
}

@media (max-width: 600px) {
    #scanner {
        max-width: 280px;
    }
    #scanner video {
    width: 100% !important;
    height: auto !important;
    border-radius: 10px;
}

#scanner {
    border: 2px dashed #4ade80;
    padding: 10px;
    border-radius: 12px;
    background: #000;
}
}
</style>

<script>
Quagga.init({
    inputStream: {
        type: "LiveStream",
        target: document.querySelector('#scanner'),
        constraints: {
            facingMode: "environment", // back camera
            focusMode: "continuous"
        }
    },
    decoder: {
        readers: ["ean_reader"] // THIS is key for ISBN
    }
}, function(err) {
    if (err) {
        console.error(err);
        return;
    }
    Quagga.start();
});

Quagga.onDetected(function(result) {
    const code = result.codeResult.code;
    console.log("Detected:", code);

    document.getElementById("barcodeInput").value = code;
    document.getElementById("isbnForm").submit();

    Quagga.stop(); // stop after first scan
});
</script>

{% endblock %}
