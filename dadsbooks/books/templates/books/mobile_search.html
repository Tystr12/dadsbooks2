{% extends "books/base.html" %}

{% block content %}

<h1>Mobile ISBN Search</h1>

<div id="scanner"></div>

<form method="post" id="isbnForm">
    {% csrf_token %}
    {{ form.as_p }}
</form>

<script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>

<script>
let scanned = false;

Quagga.init({
    inputStream: {
        type: "LiveStream",
        target: document.querySelector('#scanner'),
        constraints: {
            facingMode: "environment"
        }
    },
    decoder: {
        readers: ["ean_reader"]
    }
}, function(err) {
    if (err) {
        console.error(err);
        return;
    }
    Quagga.start();
});

Quagga.onDetected(function(result) {
    if (scanned) return;

    const code = result.codeResult.code;

    if (!code || code.length !== 13) return;

    scanned = true;

    document.getElementById("id_barcode").value = code;
    document.getElementById("isbnForm").submit();

    Quagga.stop();
});
</script>

<style>
#scanner {
    width: 100%;
    max-width: 350px;
    margin: 0 auto;
    border: 2px dashed #4ade80;
    padding: 10px;
    border-radius: 12px;
    background: #000;
}

#scanner video {
    width: 100% !important;
    height: auto !important;
    border-radius: 10px;
}

@media (max-width: 600px) {
    #scanner {
        max-width: 280px;
    }
}
</style>

{% endblock %}
