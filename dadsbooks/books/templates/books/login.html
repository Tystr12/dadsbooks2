{% extends "books/base.html" %}

{% block content %}

<h1>Log in</h1>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    <button type="submit">Log in</button>
</form>
<a href="{% url 'shop' %}" class="btn btn-secondary">Back to shop</a>
<a href="{% url 'password_reset' %}">Forgot password?</a>
{% endblock %}
