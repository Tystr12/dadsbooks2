{% extends "books/base.html" %}

{% block content %}

<h1>Scan or enter ISBN</h1>

<form method="post">
    {% csrf_token %}
    
    <p>
        <label>Barcode / ISBN:</label>
        {{ form.barcode }}
    </p>

    <button type="submit">Look up book</button>
</form>
<a href="{% url 'add' %}">Add book manually</a>
{% endblock %}
