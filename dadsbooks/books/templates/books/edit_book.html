{% extends "books/base.html" %}

{% block content %}

<h1>Edit book</h1>

<style>
    .book-layout {
        display: grid;
        grid-template-columns: 220px 1fr;
        gap: 32px;
        align-items: start;
    }

    .cover {
        width: 100%;
        max-height: 330px;
        object-fit: contain;
        border-radius: 8px;
        background: #eee;
        border: 1px solid #ddd;
    }

    form p {
        margin-bottom: 18px;
    }

    label {
        display: block;
        font-weight: bold;
        margin-bottom: 6px;
    }

    input[type="text"],
    input[type="number"],
    input[type="url"],
    textarea,
    select {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border: 1px solid #ccd1d5;
        border-radius: 6px;
        font-size: 15px;
    }

    textarea {
        min-height: 160px;
        resize: vertical;
    }

    .buttons {
        margin-top: 24px;
        display: flex;
        gap: 12px;
        align-items: center;
    }

    button {
        background: #2563eb;
        color: white;
        border: none;
        padding: 10px 18px;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #1d4ed8;
    }

    .cancel {
        color: #555;
        text-decoration: none;
    }

    .cancel:hover {
        text-decoration: underline;
    }
    .danger {
    background: #dc2626;
}

.danger:hover {
    background: #b91c1c;
}

.danger-outline {
    background: white;
    color: #dc2626;
    border: 1px solid #dc2626;
}

.danger-outline:hover {
    background: #fee2e2;
}
</style>

<div class="book-layout">
    <div>
        {% if book.image_url %}
        <img class="cover" src="{{ book.image_url }}" alt="Book cover">
        {% else %}
        <p>No cover image found.</p>
        {% endif %}
    </div>

    <div class="edit-layout">

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="button-row">
            <button type="submit" class="btn btn-primary">Update book</button>
            <button type="submit" name="delete_one" class="btn btn-danger">Delete one copy</button>
            <button type="submit" name="delete_all" class="btn btn-outline-danger">Delete book completely</button>
            <a href="{% url 'dashboard' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
