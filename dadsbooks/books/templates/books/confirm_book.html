{% extends "books/base.html" %}

{% block content %}

<style>
    .confirm-layout {
        display: flex;
        gap: 40px;
        align-items: flex-start;
    }

    .book-cover-box img {
        max-width: 320px;
        width: 100%;
        height: auto;
        border-radius: 8px;
        background: #eee;
        border: 1px solid #ddd;
    }

    .confirm-form {
        flex: 1;
    }

    .confirm-form p {
        margin-bottom: 18px;
    }

    .confirm-form label {
        display: block;
        font-weight: bold;
        margin-bottom: 6px;
    }

    .confirm-form input,
    .confirm-form textarea,
    .confirm-form select {
        width: 100%;
        box-sizing: border-box;
        padding: 10px 12px;
        border: 1px solid #ccd1d5;
        border-radius: 6px;
        font-size: 15px;
    }

    .confirm-form textarea {
        min-height: 160px;
        resize: vertical;
    }

    .button-row {
        margin-top: 24px;
        display: flex;
        gap: 12px;
        align-items: center;
    }

    @media (max-width: 768px) {
        .confirm-layout {
            flex-direction: column;
            gap: 20px;
        }

        .book-cover-box {
            width: 100%;
            text-align: center;
        }

        .book-cover-box img {
            max-width: 260px;
        }

        .confirm-form {
            width: 100%;
        }

        .button-row {
            flex-direction: column;
        }

        .button-row button,
        .button-row a {
            width: 100%;
        }
    }
</style>

<h1>Check book details before saving</h1>

<div class="confirm-layout">
    <div class="book-cover-box">
        {% if form.image_url.value %}
            <img src="{{ form.image_url.value }}" alt="Book cover">
        {% else %}
            <p>No cover image found.</p>
        {% endif %}
    </div>

    <form method="post" action="{% url 'add' %}" class="confirm-form" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}

        <div class="button-row">
            <button type="submit" name="confirm_save" class="btn btn-primary">Save book</button>
            <a href="{% url 'search' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
