{% extends "books/base.html" %}

{% block content %}

<h1>Quick add by ISBN</h1>

<p>Scan or enter an ISBN to add one copy immediately without confirmation.</p>

<form method="post">
    {% csrf_token %}

    <p>
        <label>Barcode / ISBN:</label>
        {{ form.barcode }}
    </p>

    <button type="submit">Quick add</button>
</form>

<a href="{% url 'dashboard' %}">Back to dashboard</a>

{% endblock %}
